# crowdsec_access.conf
# Per-vhost include — add inside every server {} or location {} block you want protected.
#
# Usage in your vhost:
#   server {
#       ...
#       include /etc/openresty/conf.d/crowdsec_access.conf;
#       ...
#   }
#
# The access_by_lua_block runs AFTER nginx's own access checks (allow/deny)
# and BEFORE the request is proxied or served.

access_by_lua_block {
    require("crowdsec.access").check()
}
