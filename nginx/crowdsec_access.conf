# crowdsec_access.conf
# Per-vhost snippet — include inside every server {} block you want protected.
# Installed to /etc/nginx/snippets/ (NOT conf.d/ — must NOT be auto-included
# at the http {} level, as that conflicts with the official CrowdSec bouncer's
# access_by_lua_block).
#
# Usage in your vhost:
#   server {
#       ...
#       include /etc/nginx/snippets/crowdsec_access.conf;
#       ...
#   }
#
# The access_by_lua_block runs AFTER nginx's own access checks (allow/deny)
# and BEFORE the request is proxied or served.

access_by_lua_block {
    require("crowdsec.access").check()
}
