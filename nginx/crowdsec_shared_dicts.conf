# crowdsec_shared_dicts.conf
# Include in the http {} block ONCE (e.g. in /etc/openresty/nginx.conf or conf.d/00-shared.conf)
# These three dicts are the only shared memory used by the CrowdSec Lua layer.

# ── Verdict cache ─────────────────────────────────────────────────────────────
# Holds per-IP and per-CIDR verdicts ("level:score:source").
# 50 MB supports ~1.5M unique IP entries (format is compact ~30 bytes/entry).
# Entries have TTLs (set by Python sync); flush_expired() called each sync tick.
#
# NOTE: Named "cscf_verdicts" (not "crowdsec_cache") to avoid collision with
# the official CrowdSec OpenResty bouncer which also uses "crowdsec_cache".
lua_shared_dict cscf_verdicts 50m;

# ── Counters and metrics ───────────────────────────────────────────────────────
# Holds all named counters (heuristic hits, denies, tarpits, etc.).
# Shared across all workers; ngx.shared.dict:incr() is atomic.
# 10 MB is enough for ~300K named counters; we use ~20 named keys.
lua_shared_dict crowdsec_metrics 10m;

# ── State / sync metadata ─────────────────────────────────────────────────────
# sync_version, sync_ts, sync_entries, tarpit_active, escalation dedup flags.
# 5 MB cap; escalation dedup keys auto-expire after 5 min.
lua_shared_dict crowdsec_state 5m;
