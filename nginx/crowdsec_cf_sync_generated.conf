# crowdsec_cf_sync_generated.conf — TEMPLATE
#
# This file is GENERATED by scripts/install-v3.sh — do not edit manually.
# The installer writes the real version to your nginx conf.d/ directory,
# adapting content based on the detected environment (standalone vs coexistence
# with the official CrowdSec OpenResty bouncer).
#
# Run to (re)generate:
#   sudo bash scripts/install-v3.sh
#
# ── What the installer puts in this file ──────────────────────────────────────
#
# Always:
#   lua_shared_dict cscf_verdicts    50m;   # verdict cache (NOT crowdsec_cache)
#   lua_shared_dict crowdsec_metrics 10m;   # atomic counters
#   lua_shared_dict crowdsec_state    5m;   # sync metadata + tarpit semaphore
#
# Standalone mode (no official CrowdSec OpenResty bouncer):
#   lua_package_path "...";
#   init_by_lua_block { pcall-protected module preloads }
#   init_worker_by_lua_block { require("crowdsec.sync").start() }
#
# Coexistence mode (official bouncer present):
#   Those three directives are MERGED into crowdsec_openresty.conf instead.
#   This file contains only the shared dict declarations + a comment explaining
#   what was merged where.
#
# ── Why a generated file instead of static files ──────────────────────────────
#
# V3.2 modified crowdsec_openresty.conf in-place, which made rollback hard
# and re-installation non-idempotent. V3.3 generates one file, keeps all
# context in the install log, and rolls back cleanly by restoring backups.

# Standalone example (install-v3.sh writes this when no official bouncer):
lua_shared_dict cscf_verdicts    50m;
lua_shared_dict crowdsec_metrics 10m;
lua_shared_dict crowdsec_state    5m;

lua_package_path "/etc/openresty/lua/?.lua;;";

init_by_lua_block {
    local ok, err = pcall(function()
        require "crowdsec.init"
        require "crowdsec.lookup"
        require "crowdsec.heuristics"
        require "crowdsec.mitigation"
        require "crowdsec.tarpit"
        require "crowdsec.sync"
        require "crowdsec.events"
        require "crowdsec.access"
        require "crowdsec.metrics"
    end)
    if not ok then
        ngx.log(ngx.ERR, "[crowdsec-cf-sync] init failed (fail-open): ", err)
    end
}

init_worker_by_lua_block {
    local ok, err = pcall(function()
        require("crowdsec.sync").start()
    end)
    if not ok then
        ngx.log(ngx.ERR, "[crowdsec-cf-sync] worker init failed: ", err)
    end
}
