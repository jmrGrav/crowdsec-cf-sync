# crowdsec_status.conf
# Internal debug/metrics endpoints. Include in your main server {} or a dedicated
# internal server block listening on 127.0.0.1 only.
#
# Access:
#   curl -s http://127.0.0.1/crowdsec-status | python3 -m json.tool
#   curl -s http://127.0.0.1/crowdsec-metrics   # Prometheus text

location = /crowdsec-status {
    allow 127.0.0.1;
    deny  all;
    access_log off;
    content_by_lua_block {
        require("crowdsec.metrics").handle()
    }
}

location = /crowdsec-metrics {
    allow 127.0.0.1;
    deny  all;
    access_log off;
    content_by_lua_block {
        require("crowdsec.metrics").handle_prometheus()
    }
}
