# crowdsec_status.conf
# Internal debug/metrics endpoint snippets. Include inside a server {} block
# that listens on 127.0.0.1 only (e.g. the dedicated port-8091 block created
# by nginx_status_internal.conf, or your main server if access-restricted).
# Installed to /etc/nginx/snippets/ — NOT conf.d/.
#
# Access:
#   curl -s http://127.0.0.1:8091/crowdsec-status | python3 -m json.tool
#   curl -s http://127.0.0.1:8091/crowdsec-metrics   # Prometheus text

location = /crowdsec-status {
    allow 127.0.0.1;
    deny  all;
    access_log off;
    content_by_lua_block {
        require("crowdsec.metrics").handle()
    }
}

location = /crowdsec-metrics {
    allow 127.0.0.1;
    deny  all;
    access_log off;
    content_by_lua_block {
        require("crowdsec.metrics").handle_prometheus()
    }
}
