# crowdsec_init.conf
# Include in the http {} block, after crowdsec_shared_dicts.conf.
# Sets the Lua module path and initializes one background sync timer per worker.

# ── Lua module path ───────────────────────────────────────────────────────────
# lua_package_path is already set in crowdsec_openresty.conf (official bouncer).
# On fresh installs WITHOUT the official bouncer, add:
#   lua_package_path "/etc/openresty/lua/?.lua;;";
# to your main nginx.conf http {} block instead.

# ── Master process init ───────────────────────────────────────────────────────
# Preload modules into Lua state. Shared dicts are NOT accessible here
# (they're shared among workers, not the master). Pure constant loading only.
init_by_lua_block {
    -- Preload module to catch syntax errors at startup (not per-request)
    require "crowdsec.init"
    require "crowdsec.lookup"
    require "crowdsec.heuristics"
    require "crowdsec.mitigation"
    require "crowdsec.tarpit"
    require "crowdsec.sync"
    require "crowdsec.events"
    require "crowdsec.access"
    require "crowdsec.metrics"
}

# ── Worker init: start background sync timer ──────────────────────────────────
# Each worker independently loads bans.json into its own shared dict view.
# ngx.timer.every() is non-blocking; it runs in a background coroutine.
init_worker_by_lua_block {
    local sync = require "crowdsec.sync"
    sync.start()
}
